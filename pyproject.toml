[project]
name = "copa-bolao-2026"
version = "0.1.0"
description = "Bolão Copa do Mundo 2026 — Streamlit + Supabase"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.45.0",
    "supabase>=2.9.0",
    "pandas>=2.2.0",
    "altair>=5.5.0",
    "statsmodels>=0.14",
    "scipy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "app_pages"]

[tool.uv]
dev-dependencies = ["pytest>=8.0.0"]
